name: Executar Agente Macro Automatizado

on:
  schedule:
    # Roda toda Segunda-Feira às 12:00 UTC (08:00 AM no horário de Brasília)
    - cron: '0 12 * * 1'
  workflow_dispatch: # Permite disparar o relatório manualmente pelo botão no GitHub se desejar

jobs:
  run-macro-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v3

      - name: Configurar o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

     - name: Instalar Bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Agente Macro e Enviar no Telegram
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
